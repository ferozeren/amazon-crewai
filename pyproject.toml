[project]
name = "amazon-crewai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai>=1.15.0",
    "fastapi>=0.110.0",
    "joblib>=1.3.0",
    "langchain-google-genai>=1.0.0",
    "litellm>=1.88.0",
    "lxml>=5.0.0",
    "numpy>=2.5.1",
    "openai>=2.0.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.28.0",
]

[project.scripts]
amazon-crewai = "amazon_crewai.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
